<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui 数値</title>
<!-- Kodou-ui の部品の見本: 数値（number stepper）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「数値」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-number" data-grp="入力">
  <div class="comp-head"><h2>数値<span class="en">number stepper</span></h2><span class="tag t4">うまくなる</span></div>
  <p class="lead">ボタンでも、矢印キーでも、直接打っても変えられます。範囲の端では、なぜ止まったかを出します。</p>
  <div class="box"><span class="ttl">見本</span><div class="box-in row" style="align-items:flex-start;gap:14px 32px">
    <div class="field"><span class="lb">並列数</span>
      <div class="stepper" id="step" data-key="↑↓"><button data-d="-1" aria-label="減らす">−</button><input id="stVal" value="4" inputmode="numeric" aria-label="並列数"><button data-d="1" aria-label="増やす">+</button></div>
      <div class="help" id="stHelp"></div></div>
    <div class="field"><span class="lb">無効</span><div class="stepper"><button disabled>−</button><input value="2" disabled aria-label="無効"><button disabled>+</button></div></div>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">数値</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* 数値 */
const ST = { min: 1, max: 8 };
function setStep(v, say) {
  const n = Math.max(ST.min, Math.min(ST.max, v)); $('#stVal').value = n;
  const [dec, inc] = $$('#step button'); dec.disabled = n <= ST.min; inc.disabled = n >= ST.max;
  const h = $('#stHelp');
  if (v > ST.max) { h.className = 'help err'; h.textContent = `${ST.max} が上限です（CPU のコア数に合わせています）` }
  else if (v < ST.min) { h.className = 'help err'; h.textContent = `${ST.min} より少なくはできません` }
  else { h.className = 'help'; h.innerHTML = `1〜8。<kbd>↑</kbd><kbd>↓</kbd> で1つ、<kbd>⇧</kbd> を押しながらで最大・最小` }
  if (say) sl.msg(`並列数: ${n}`);
}
$('#step').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setStep(+$('#stVal').value + +b.dataset.d, 1) });
$('#step').addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') { e.preventDefault(); setStep(e.shiftKey ? ST.max : +$('#stVal').value + 1, 1) }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setStep(e.shiftKey ? ST.min : +$('#stVal').value - 1, 1) }
});
$('#stVal').addEventListener('change', e => setStep(parseInt(e.target.value, 10) || ST.min, 1));
setStep(4);
</script>
</body>
</html>
