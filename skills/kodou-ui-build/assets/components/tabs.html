<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui タブ</title>
<!-- Kodou-ui の部品の見本: タブ（tabs）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「タブ」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-tabs" data-grp="移動">
  <div class="comp-head"><h2>タブ<span class="en">tabs</span></h2><span class="tag t4">うまくなる</span></div>
  <p class="lead">選んだタブは反転で示し、件数を添えます。<kbd>←</kbd><kbd>→</kbd> で移れます。</p>
  <div class="box"><span class="ttl">見本</span><div class="tabs" role="tablist" id="tabs" data-key="←→"></div><div class="tab-body" id="tabBody" role="tabpanel"></div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">タブ</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* タブ: 作るのは1回、切り替えは属性だけ */
(() => {
  const T = [['概要', null, 'この PR は、入力の言い方をチップに置き換えて見せます。'], ['変更', 12, '12ファイルを変更しています。+124 -18'], ['コミット', 3, '3件のコミットがあります。最新は a1b2c3d です。'], ['チェック', 1, '1件のチェックが失敗しています。lint の結果を確かめてください。'], ['デプロイ', null, '', true]];
  const el = $('#tabs'); let cur = 0;
  el.innerHTML = T.map(([l, n, , dis], i) => `<button role="tab" data-i="${i}" ${dis ? 'disabled title="main に入ってから使えます"' : ''}>${l}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('');
  const bs = el.children;
  const sel = i => { bs[cur].setAttribute('aria-selected', false); bs[cur].tabIndex = -1; cur = i; bs[i].setAttribute('aria-selected', true); bs[i].tabIndex = 0; $('#tabBody').textContent = T[i][2] };
  for (const b of bs) { b.setAttribute('aria-selected', false); b.tabIndex = -1 }
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.disabled) { sel(+b.dataset.i); sl.msg(`タブ: ${T[cur][0]}`) } });
  el.addEventListener('keydown', e => { const en = T.map((t, i) => t[3] ? -1 : i).filter(i => i >= 0); let k = en.indexOf(cur); if (e.key === 'ArrowRight') k = (k + 1) % en.length; else if (e.key === 'ArrowLeft') k = (k - 1 + en.length) % en.length; else return; sel(en[k]); bs[cur].focus(); sl.msg(`タブ: ${T[cur][0]}`) });
  sel(0);
})();
</script>
</body>
</html>
