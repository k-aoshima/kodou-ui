<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui キーと値</title>
<!-- Kodou-ui の部品の見本: キーと値（key-value）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「キーと値」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-kv" data-grp="表示">
  <div class="comp-head"><h2>キーと値<span class="en">key-value</span></h2><span class="tag t2">中が見える</span></div>
  <p class="lead">点線でキーと値をつなぎます。値はぼかさず、そのままコピーできます。</p>
  <div class="box"><span class="ttl">環境</span><dl class="kv" id="kv"></dl></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">キーと値</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* キーと値 */
(() => {
  const KV = [['node', 'v20.12.2'], ['npm', '10.5.0'], ['リポジトリ', 'github.com/example/kodou-ui'], ['ブランチ', 'feat/key-cast'], ['最後のコミット', 'a1b2c3d  ステータスラインに押したキーを出す'], ['ポート', '8080'], ['環境', 'development']];
  $('#kv').innerHTML = KV.map(([k, v], i) => `<dt>${esc(k)}</dt><dd title="${esc(v)}">${esc(v)}</dd><button class="cp" data-i="${i}" aria-label="${esc(k)} をコピー">${px('copy', 0, false, true)}</button>`).join('');
  $('#kv').addEventListener('click', async e => {
    const b = e.target.closest('.cp'); if (!b) return; const [k, v] = KV[+b.dataset.i];
    try { await navigator.clipboard.writeText(v); sl.msg(`${k} をコピーしました: ${v}`) } catch { sl.msg(`コピーできませんでした。値を選んでコピーしてください: ${v}`) }
  });
})();
</script>
</body>
</html>
