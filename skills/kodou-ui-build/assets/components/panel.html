<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui パネル</title>
<!-- Kodou-ui の部品の見本: パネル（panel）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「パネル」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-panel" data-grp="かけら">
  <div class="comp-head"><h2>パネル<span class="en">panel</span></h2></div>
  <p class="lead">罫線の枠に、左上の名前と右上の状態、下にキーの帯を付けます。すべての部品の入れ物です。</p>
  <div class="box"><span class="ttl">名前 <span class="faint">~/path</span></span><span class="ttl-r"><span class="c-green">●</span> 状態</span>
    <div class="box-in read" style="font-size:14px;line-height:1.8">中身が入ります。中身が文なら UD 書体、データなら等幅で組みます。</div>
    <div class="keys"><span><kbd>⏎</kbd>主な操作</span><span><kbd>Esc</kbd>閉じる</span></div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">パネル</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>

</script>
</body>
</html>
