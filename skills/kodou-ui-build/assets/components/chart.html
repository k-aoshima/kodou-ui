<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui 棒グラフ</title>
<!-- Kodou-ui の部品の見本: 棒グラフ（bar chart）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「棒グラフ」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-chart" data-grp="グラフ">
  <div class="comp-head"><h2>棒グラフ<span class="en">bar chart</span></h2><span class="tag t2">中が見える</span></div>
  <p class="lead">ブロックを積んだ棒で、目盛りは値と同じ縮尺です。棒に触れると値が出ます。上限を超えた分は、色だけでなく斜線と「+分」の文字でも示します。</p>
  <div class="box"><span class="ttl">1日のビルド時間（分）</span><span class="ttl-r">上限 60分</span><div class="chart" id="barChart"></div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">棒グラフ</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* グラフの共通 */
const axis = (max, step) => { const t = []; for (let v = 0; v <= max; v += step) t.push(v); return t };
function tipFor(host) { const t = document.createElement('div'); t.className = 'tip'; t.hidden = true; host.appendChild(t); return t }
const showTip = (t, x, y, html) => { t.hidden = false; t.innerHTML = html; t.style.transform = `translate(calc(${x}px - 50%), calc(${y}px - 120%))` };

/* 棒グラフ */
(() => {
  const D = [['月', 42], ['火', 58], ['水', 35], ['木', 71], ['金', 64], ['土', 12], ['日', 0]], MAX = 80, LIMIT = 60, ticks = axis(MAX, 20);
  $('#barChart').innerHTML = `<div class="ch-legend"><span><i class="sw-blue"></i>上限まで（横縞）</span><span><i class="sw-red"></i>上限を超えた分（斜線と +分）</span></div>
    <div class="plot-wrap"><div class="yax">${ticks.map(v => `<span style="bottom:${v / MAX * 100}%">${v}</span>`).join('')}</div>
    <div class="plot" id="barPlot">${ticks.slice(1).map(v => `<div class="gl" style="bottom:${v / MAX * 100}%"></div>`).join('')}
    <div class="thr" style="bottom:${LIMIT / MAX * 100}%"><span>上限 ${LIMIT}</span></div>
    <div class="bars">${D.map(([d, v], i) => `<div class="bar" data-i="${i}" style="height:${v / MAX * 100}%" tabindex="0" aria-label="${d}曜 ${v}分">${v > LIMIT ? `<div class="ov" style="height:${(v - LIMIT) / v * 100}%"></div><span class="ovl">+${v - LIMIT}</span>` : ''}</div>`).join('')}</div></div></div>
    <div class="xax">${D.map(([d]) => `<span>${d}</span>`).join('')}</div>`;
  const plot = $('#barPlot'), tip = tipFor(plot);
  const show = b => frame('bar', () => { const [d, v] = D[+b.dataset.i]; const pr = plot.getBoundingClientRect(), r = b.getBoundingClientRect(); showTip(tip, r.left - pr.left + r.width / 2, r.top - pr.top, `${d}曜 <b>${v}分</b>${v > LIMIT ? ` (+${v - LIMIT})` : v === 0 ? ' ビルドなし' : ''}`); sl.msg(`${d}曜のビルド: ${v}分`) });
  plot.addEventListener('pointerover', e => { const b = e.target.closest('.bar'); if (b) show(b) });
  plot.addEventListener('focusin', e => { const b = e.target.closest('.bar'); if (b) show(b) });
  plot.addEventListener('pointerleave', () => { tip.hidden = true }); plot.addEventListener('focusout', () => { tip.hidden = true });
})();
</script>
</body>
</html>
