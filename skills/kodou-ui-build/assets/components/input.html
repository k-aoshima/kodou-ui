<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui テキスト入力</title>
<!-- Kodou-ui の部品の見本: テキスト入力（text input）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「テキスト入力」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-input" data-grp="入力">
  <div class="comp-head"><h2>テキスト入力<span class="en">text input</span></h2><span class="tag t1">手応え</span><span class="tag t2">中が見える</span></div>
  <p class="lead">打つたびに確かめ、何が駄目でどう直せばよいかをその場で出します。送るまで待たせません。</p>
  <div class="box"><span class="ttl">見本</span><div class="box-in grid2" style="gap:14px 16px">
    <div class="field"><label for="brName">ブランチ名</label>
      <div class="inp" id="brInp"><span class="fx">feat/</span><input id="brName" value="status-colors" spellcheck="false" autocomplete="off"></div>
      <div class="help" id="brHelp">英小文字・数字・ハイフンが使えます</div></div>
    <div class="field"><label for="host">公開する URL <span class="opt">任意</span></label>
      <div class="inp"><span class="fx">https://</span><input id="host" placeholder="my-tool" spellcheck="false" pattern="[a-z0-9\-]+"><span class="fx">.dev</span></div>
      <div class="help" id="hostHelp">空のままなら公開しません</div></div>
  </div></div>
  <div class="box"><span class="ttl">状態</span><div class="box-in states">
    <div class="state-cell"><span class="lb">通常</span><div class="inp"><input value="main" aria-label="通常"></div></div>
    <div class="state-cell"><span class="lb">フォーカス</span><div class="inp is-focus"><input value="main" aria-label="フォーカス"></div></div>
    <div class="state-cell"><span class="lb">無効</span><div class="inp is-disabled"><input value="main" disabled aria-label="無効"></div></div>
    <div class="state-cell"><span class="lb">エラー</span><div class="inp is-error"><input value="Feat X" aria-label="エラー"></div><span class="help err">空白は使えません</span></div>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">テキスト入力</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* テキスト入力 */
const TAKEN = ['main', 'key-cast', 'log-follow'];
function checkBranch() {
  const v = $('#brName').value; let err = '';
  if (!v) err = '名前を入れてください';
  else if (/\s/.test(v)) err = '空白は使えません。ハイフンでつないでください';
  else if (/[A-Z]/.test(v)) err = `大文字は使えません。「${v.toLowerCase()}」にしますか`;
  else if (/[^a-z0-9-]/.test(v)) err = '英小文字・数字・ハイフンだけが使えます';
  else if (TAKEN.includes(v)) err = `feat/${v} はもうあります`;
  $('#brInp').classList.toggle('is-error', !!err);
  const h = $('#brHelp'); h.className = 'help ' + (err ? 'err' : 'ok');
  h.innerHTML = err ? esc(err) : `✓ feat/${esc(v)} は使えます<span class="cnt">${v.length}/40</span>`;
}
$('#brName').addEventListener('input', () => frame('br', checkBranch)); checkBranch();
$('#host').addEventListener('input', e => frame('host', () => {
  const v = e.target.value.trim(), h = $('#hostHelp'), ok = /^[a-z0-9-]+$/.test(v);
  h.className = 'help' + (v ? ok ? ' ok' : ' err' : '');
  h.textContent = !v ? '空のままなら公開しません' : ok ? `https://${v}.dev で公開します` : '英小文字・数字・ハイフンだけが使えます';
}));
</script>
</body>
</html>
