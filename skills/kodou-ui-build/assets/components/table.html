<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui 表</title>
<!-- Kodou-ui の部品の見本: 表（table）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「表」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-table" data-grp="表示">
  <div class="comp-head"><h2>表<span class="en">table</span></h2><span class="tag t4">うまくなる</span></div>
  <p class="lead">見出しで並べ替え、行を選べます。数字は右にそろえ、桁を合わせます。描くのは見えている行だけで、並べ替えても行は作り直さず、並びだけ動かします。</p>
  <div class="box" id="tblBox" data-key="j/k Space s" tabindex="0"><span class="ttl">依存パッケージ</span><span class="ttl-r" id="tbN"></span>
    <div class="scroll-x tbl-scroll" id="tblScroll"><table class="t" id="tbl"><thead></thead><tbody></tbody></table></div>
    <div class="keys"><span><kbd>j/k</kbd>移動</span><span><kbd>Space</kbd>選ぶ</span><span><kbd>s</kbd>並べ替え</span></div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">表</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* 表: 見えている行だけ描く。並べ替えは番号の並びを並べ直して描き直すだけ。並びが変わるときだけ短く動かす */
(() => {
  const TB = [
    { n: 'react', v: '18.3.1', s: 312, u: 3, t: [3, 4, 4, 5, 6, 6, 7, 8] },
    { n: 'typescript', v: '5.4.5', s: 22800, u: 12, t: [6, 6, 5, 6, 7, 7, 7, 8] },
    { n: 'vite', v: '5.2.11', s: 3100, u: 5, t: [2, 3, 3, 5, 5, 6, 8, 8] },
    { n: 'zod', v: '3.23.8', s: 640, u: 30, t: [1, 2, 2, 3, 3, 4, 5, 6] },
    { n: 'prettier', v: '3.2.5', s: 8400, u: 41, t: [5, 5, 5, 4, 4, 4, 5, 5] },
    { n: 'date-fns', v: '3.6.0', s: 21900, u: 70, t: [4, 3, 3, 2, 2, 2, 1, 1] },
  ];
  const COLS = [['n', '名前'], ['v', '版'], ['s', '大きさ', 1], ['u', '更新', 1], ['t', '週の取得数']];
  const st = { key: 's', dir: -1, act: 0 };
  const size = kb => kb >= 1000 ? (kb / 1000).toFixed(1) + 'M' : kb + 'K';
  const picked = new Set(['vite']);
  let order = TB.slice();
  const v = virt($('#tblScroll'), {
    H: 24, parent: $('#tbl tbody'), id: 'tb-', owner: $('#tblBox'), stick: () => $('#tbl thead').offsetHeight,
    gap: () => { const tr = document.createElement('tr'), td = document.createElement('td'); td.colSpan = COLS.length + 1; tr.append(td); return tr },
    make: () => { const tr = document.createElement('tr'); tr.innerHTML = '<td class="ck"></td><td></td><td class="dim"></td><td class="num"></td><td class="num"></td><td><span class="spark"></span> <span class="dim"></span></td>'; return tr },
    fill: (tr, i) => { const r = order[i], c = tr.children; tr.dataset.n = r.n; tr.setAttribute('aria-rowindex', i + 2);  /* 見出しの行が 1 */ c[1].textContent = r.n; c[2].textContent = r.v; c[3].textContent = size(r.s); c[4].textContent = `${r.u}日前`; c[5].firstChild.textContent = spark(r.t); c[5].lastChild.textContent = `${r.t[0]}→${r.t[r.t.length - 1]}` },
    mark: (tr, i) => { tr.classList.toggle('on', i === st.act); tr.classList.toggle('picked', picked.has(order[i].n)) },
  });
  const count = () => { $('#tbN').textContent = `${TB.length}件 / ${picked.size}件 選択` };
  function sort() {
    const rowsNow = [...$('#tbl tbody').children].filter(tr => !tr.hidden && !tr.classList.contains('v-gap'));
    const before = new Map(rowsNow.map(tr => [tr.dataset.n, tr.getBoundingClientRect().top]));
    order = TB.slice().sort((a, b) => { const x = a[st.key], y = b[st.key]; return (typeof x === 'string' ? x.localeCompare(y) : x - y) * st.dir });
    v.set(order.length); v.active(st.act);
    // 並びが変わるときだけ短く動かす: 前に見えていた行は、前の位置から今の位置へ滑らせる
    if (before.size && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const moved = [];
      for (const tr of $('#tbl tbody').children) { if (tr.hidden || tr.classList.contains('v-gap')) continue; const b = before.get(tr.dataset.n); if (b == null) continue; const d = b - tr.getBoundingClientRect().top; if (d) { tr.classList.remove('flip'); tr.style.transform = `translateY(${d}px)`; moved.push(tr) } }
      requestAnimationFrame(() => { for (const tr of moved) { tr.classList.add('flip'); tr.style.transform = '' } });
    }
    $('#tbl').setAttribute('aria-rowcount', TB.length + 1); $('#tbl thead').innerHTML = `<tr aria-rowindex="1"><th class="ck" aria-label="選択"></th>${COLS.map(([k, l, num]) => `<th class="${num ? 'num' : ''}" ${st.key === k ? `aria-sort="${st.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${k === 't' ? l : `<button data-k="${k}">${l}<span class="ar">${st.key === k ? (st.dir > 0 ? '▲' : '▼') : '△'}</span></button>`}</th>`).join('')}</tr>`;
  }
  const setAct = i => { const p = st.act; st.act = Math.max(0, Math.min(order.length - 1, i)); v.mark(p); v.to(st.act); v.active(st.act) };
  const pick = i => { const n = order[i].n; picked.has(n) ? picked.delete(n) : picked.add(n); v.mark(i); count() };
  const label = k => COLS.find(c => c[0] === k)[1];
  $('#tbl').addEventListener('click', e => {
    const b = e.target.closest('th button');
    if (b) { const k = b.dataset.k; st.dir = st.key === k ? -st.dir : (k === 'n' || k === 'v' ? 1 : -1); st.key = k; sort(); sl.msg(`${label(k)} で${st.dir > 0 ? '小さい順' : '大きい順'}に並べました`); return }
    const i = v.index(e.target.closest('tbody tr')); if (i < 0) return;
    setAct(i); if (e.target.closest('.ck')) pick(i);
  });
  $('#tblBox').addEventListener('keydown', e => {
    if (e.target.matches('button')) return;
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); setAct(st.act + 1) }
    else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); setAct(st.act - 1) }
    else if (e.key === ' ') { e.preventDefault(); pick(st.act) }
    else if (e.key === 's') { const ks = ['n', 'v', 's', 'u']; st.key = ks[(ks.indexOf(st.key) + 1) % ks.length]; st.dir = st.key === 'n' || st.key === 'v' ? 1 : -1; sort(); sl.msg(`${label(st.key)} で並べました`) }
  });
  sort(); count();
})();
</script>
</body>
</html>
