<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui 点の多いグラフ</title>
<!-- Kodou-ui の部品の見本: 点の多いグラフ（canvas）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「点の多いグラフ」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-canvas" data-grp="グラフ">
  <div class="comp-head"><h2>点の多いグラフ<span class="en">canvas</span></h2><span class="tag t2">中が見える</span></div>
  <p class="lead">点が多いものは canvas に描き、描く幅の1列に1点まで間引きます。列ごとに最小と最大を残すので、山は消えません。</p>
  <div class="box"><span class="ttl">CPU 使用率 20,000 点（%）</span><div class="chart" id="cvChart"></div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">点の多いグラフ</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* グラフの共通 */
const axis = (max, step) => { const t = []; for (let v = 0; v <= max; v += step) t.push(v); return t };
function tipFor(host) { const t = document.createElement('div'); t.className = 'tip'; t.hidden = true; host.appendChild(t); return t }
const showTip = (t, x, y, html) => { t.hidden = false; t.innerHTML = html; t.style.transform = `translate(calc(${x}px - 50%), calc(${y}px - 120%))` };

/* 点の多いグラフ: canvas、1列に1点（列ごとの最小と最大） */
(() => {
  const N = 20000, data = new Float32Array(N); let v = 30, seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < N; i++) { v += (rnd() - .5) * 6 + (40 - v) * .01; if (rnd() < .0015) v += 40; v = Math.max(1, Math.min(99, v)); data[i] = v }
  const MAX = 100, ticks = axis(MAX, 25);
  /* canvas は支援技術から中が見えないので、元のデータから要約を作り、role="img" の名前と下の文に出す */
  let mn = 1e9, mx = -1e9, sum = 0, over = 0;
  for (let i = 0; i < N; i++) { const x = data[i]; if (x < mn) mn = x; if (x > mx) mx = x; sum += x; if (x > 80 && !(i && data[i - 1] > 80)) over++ }
  const summary = `最小 ${mn.toFixed(0)}%、最大 ${mx.toFixed(0)}%、平均 ${(sum / N).toFixed(0)}%。80% を超えたのは ${over} 回`;
  $('#cvChart').innerHTML = `<div class="plot-wrap"><div class="yax">${ticks.map(t => `<span style="bottom:${t}%">${t}</span>`).join('')}</div><div class="cv" id="cvBox"><canvas id="cv" role="img" aria-label="CPU 使用率 20,000 点。${summary}"></canvas><div class="thr" style="bottom:80%"><span>80%</span></div></div></div><div class="xax" style="justify-content:space-between;padding:4px 0 0"><span style="width:auto">0</span><span style="width:auto">5,000</span><span style="width:auto">10,000</span><span style="width:auto">15,000</span><span style="width:auto">20,000 点目</span></div><div class="cv-info" id="cvInfo"></div>`;
  const box = $('#cvBox'), cv = $('#cv'), ctx = cv.getContext('2d'), tip = tipFor(box); let cols = 0, mins, maxs;
  function draw() {
    const t0 = performance.now(), w = Math.max(1, Math.floor(box.clientWidth)), h = Math.floor(box.clientHeight), dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = w; mins = new Float32Array(cols); maxs = new Float32Array(cols);
    for (let c = 0; c < cols; c++) { const a = Math.floor(c * N / cols), b = Math.max(a + 1, Math.floor((c + 1) * N / cols)); let mn = 1e9, mx = -1e9; for (let i = a; i < b; i++) { const x = data[i]; if (x < mn) mn = x; if (x > mx) mx = x } mins[c] = mn; maxs[c] = mx }
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = css('--rule-soft'); ctx.setLineDash([1, 3]); ctx.beginPath(); for (const t of ticks.slice(1)) { const y = Math.round(h - t / MAX * h) + .5; ctx.moveTo(0, y); ctx.lineTo(w, y) } ctx.stroke(); ctx.setLineDash([]);
    const blue = css('--blue'), red = css('--red');
    for (let c = 0; c < cols; c++) { const y1 = Math.round(h - maxs[c] / MAX * h), y2 = Math.round(h - mins[c] / MAX * h); ctx.fillStyle = maxs[c] > 80 ? red : blue; ctx.fillRect(c, y1, 1, Math.max(2, y2 - y1)) }
    $('#cvInfo').textContent = `${summary}。${N.toLocaleString()} 点を ${cols} 列に間引いて描画  ${(performance.now() - t0).toFixed(1)}ms（実測）  赤の点線より上（80% 超え）の列は赤`;
  }
  new ResizeObserver(() => frame('cv', draw)).observe(box);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => frame('cv', draw));
  new MutationObserver(() => frame('cv', draw)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  box.addEventListener('pointermove', e => { const cx = e.clientX; frame('cvtip', () => { const r = box.getBoundingClientRect(), c = Math.max(0, Math.min(cols - 1, Math.floor(cx - r.left))); const a = Math.floor(c * N / cols); showTip(tip, Math.max(90, Math.min(r.width - 90, c)), r.height - maxs[c] / MAX * r.height, `${a.toLocaleString()} 点目付近  ${mins[c].toFixed(0)}〜${maxs[c].toFixed(0)}%`) }) });
  box.addEventListener('pointerleave', () => { tip.hidden = true });
})();
</script>
</body>
</html>
