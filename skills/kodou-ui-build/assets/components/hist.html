<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui ヒストグラム</title>
<!-- Kodou-ui の部品の見本: ヒストグラム（histogram）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「ヒストグラム」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-hist" data-grp="グラフ">
  <div class="comp-head"><h2>ヒストグラム<span class="en">histogram</span></h2><span class="tag t2">中が見える</span></div>
  <p class="lead">8分の1ブロックで端数まで描き、件数を横に出します。遅い区間は色に加えて <b>▲</b> の印を付けます。</p>
  <div class="box"><span class="ttl">テスト1件あたりの時間</span><div class="hist" id="hist"></div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">ヒストグラム</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* グラフの共通 */
const axis = (max, step) => { const t = []; for (let v = 0; v <= max; v += step) t.push(v); return t };
function tipFor(host) { const t = document.createElement('div'); t.className = 'tip'; t.hidden = true; host.appendChild(t); return t }
const showTip = (t, x, y, html) => { t.hidden = false; t.innerHTML = html; t.style.transform = `translate(calc(${x}px - 50%), calc(${y}px - 120%))` };

/* ヒストグラム */
(() => {
  const H = [['<10ms', 48], ['10-25', 112], ['25-50', 86], ['50-100', 37], ['100-250', 14], ['250-500', 5], ['>500', 2]], W = 40, MX = 120, E = ' ▏▎▍▌▋▊▉█';
  const bar = v => { const f = v / MX * W, full = Math.floor(f), rem = Math.round((f - full) * 8); return '█'.repeat(full) + (rem ? E[rem] : '') };
  $('#hist').innerHTML = H.map(([l, n], i) => `<span class="lb">${l}</span><span class="b${i >= 4 ? ' hot' : ''}" title="${l}: ${n}件">${bar(n)}</span><span class="n">${n}${i >= 4 ? ' ▲' : '  '}</span>`).join('') + `<span></span><span class="scale"><span>0</span><span>30</span><span>60</span><span>90</span><span>120件</span></span><span></span><span></span><span class="faint" style="font-size:12px">▲ 100ms 以上（遅い）</span><span></span>`;
})();
</script>
</body>
</html>
