<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui コンボボックス</title>
<!-- Kodou-ui の部品の見本: コンボボックス（combobox）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「コンボボックス」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-combo" data-grp="入力">
  <div class="comp-head"><h2>コンボボックス<span class="en">combobox</span></h2><span class="tag t1">手応え</span><span class="tag t2">中が見える</span></div>
  <p class="lead">打った分だけ候補を絞り、一致した文字に下線を引きます。何件中何件かも出します。</p>
  <div class="box"><span class="ttl">見本</span><div class="box-in">
    <div class="field" style="max-width:420px"><label for="cbIn">パッケージを追加</label>
      <div class="inp" id="cbInp"><span class="fx">npm i</span><input id="cbIn" data-key="打って絞る" placeholder="名前で探す" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="cbPop"></div>
      <div class="pop" id="cbPop" popover="manual" role="listbox"></div>
      <div class="help" id="cbHelp">候補は使われた回数の順で、並びは変わりません</div></div>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">コンボボックス</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* コンボボックス: 候補は見えている分だけ描く。絞り込みは当たった番号の並びを作り直すだけ */
(() => {
  const PKGS = [['react', '18.3.1'], ['react-dom', '18.3.1'], ['typescript', '5.4.5'], ['vite', '5.2.11'], ['vitest', '1.6.0'], ['zod', '3.23.8'], ['prettier', '3.2.5'], ['eslint', '8.57.0'], ['date-fns', '3.6.0'], ['zustand', '4.5.2'], ['chalk', '5.3.0'], ['commander', '12.0.0']];
  const inp = $('#cbIn'), box = $('#cbInp'), pop = $('#cbPop');
  pop.innerHTML = `<div class="hd" id="cbCount"></div><div id="cbRows"></div><div class="empty-ln" id="cbNone" hidden></div>`;
  let vis = [], act = 0, lastQ = null, q = '';
  const v = virt(pop, {
    H: 24, parent: $('#cbRows'), id: 'cb-', owner: inp,
    make: () => { const o = document.createElement('div'); o.className = 'opt-ln'; o.setAttribute('role', 'option'); o.innerHTML = `<span class="mk">${px('pkg', 2, false, true)}</span><span class="nm"></span><span class="mt"></span>`; return o },
    fill: (o, j) => { const [n, ver] = PKGS[vis[j]], k = q ? n.indexOf(q) : -1; o.children[1].innerHTML = k >= 0 ? esc(n.slice(0, k)) + '<mark>' + esc(n.slice(k, k + q.length)) + '</mark>' + esc(n.slice(k + q.length)) : esc(n); o.children[2].textContent = ver; o.setAttribute('aria-posinset', j + 1); o.setAttribute('aria-setsize', vis.length) },
    mark: (o, j) => { o.classList.toggle('on', j === act); o.setAttribute('aria-selected', j === act) },
  });
  const open = () => { if (!pop.matches(':popover-open')) { pop.showPopover(); inp.setAttribute('aria-expanded', true) } place(pop, box) };
  const close = () => { if (pop.matches(':popover-open')) pop.hidePopover(); inp.setAttribute('aria-expanded', false) };
  function filter() {
    q = inp.value.trim().toLowerCase();
    if (q === lastQ) return;
    lastQ = q; vis = []; PKGS.forEach((p, i) => { if (p[0].includes(q)) vis.push(i) }); act = 0;
    $('#cbCount').textContent = `${vis.length}/${PKGS.length} 件`;
    const none = $('#cbNone'); none.hidden = vis.length > 0; none.textContent = `「${q}」に当てはまるものはありません`;
    pop.scrollTop = 0; v.set(vis.length); v.active(act);
  }
  const move = d => { if (!vis.length) return; const p = act; act = (act + d + vis.length) % vis.length; v.mark(p); v.to(act); v.active(act) };
  const pick = () => { const i = vis[act]; if (i == null) return; inp.value = PKGS[i][0]; close(); $('#cbHelp').innerHTML = `<span class="c-green">✓</span> npm i ${esc(PKGS[i][0])}@${PKGS[i][1]} を追加します`; sl.msg(`${PKGS[i][0]} を選びました`) };
  inp.addEventListener('focus', () => { filter(); open() });
  inp.addEventListener('input', () => frame('cb', () => { filter(); open() }));
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); open(); move(1) }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1) }
    else if (e.key === 'Enter') { e.preventDefault(); pick() }
    else if (e.key === 'Escape') close();
  });
  inp.addEventListener('blur', () => setTimeout(close, 120));
  pop.addEventListener('mousedown', e => { const j = v.index(e.target.closest('.opt-ln')); if (j >= 0) { e.preventDefault(); act = j; pick() } });
})();
</script>
</body>
</html>
