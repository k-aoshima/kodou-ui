<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui 空の状態</title>
<!-- Kodou-ui の部品の見本: 空の状態（empty state）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「空の状態」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-empty" data-grp="通知">
  <div class="comp-head"><h2>空の状態<span class="en">empty state</span></h2></div>
  <p class="lead">なぜ空なのかと、最初の1件を作る方法を書きます。</p>
  <div class="box"><span class="ttl">見本</span><div class="empty">
    <span class="ill" data-px="box" data-cell="4" data-tone></span>
    <h3>まだ開いている PR はありません</h3>
    <p><code>feat/</code> で始まるブランチから作れます。</p>
    <div class="row" style="justify-content:center"><button class="btn primary">PR を作る</button><button class="btn ghost">絞り込みを外す</button></div>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">空の状態</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>

</script>
</body>
</html>
