<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui タグ入力</title>
<!-- Kodou-ui の部品の見本: タグ入力（tag input）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「タグ入力」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-tags" data-grp="入力">
  <div class="comp-head"><h2>タグ入力<span class="en">tag input</span></h2><span class="tag t1">手応え</span></div>
  <p class="lead"><kbd>⏎</kbd> か <kbd>,</kbd> で確定し、空欄で <kbd>⌫</kbd> を押すと最後の1つを外します。重なりはその場で知らせます。</p>
  <div class="box"><span class="ttl">見本</span><div class="box-in field">
    <span class="lb">ラベル</span>
    <div class="tags-in" id="tagsBox"><input id="tagsIn" data-key="⏎ ,  ⌫" placeholder="ラベルを足す" aria-label="ラベルを足す" spellcheck="false"></div>
    <div class="help" id="tagsHelp"></div>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">タグ入力</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* タグ入力: 足すときは1つ足すだけ、外すときは1つ外すだけ */
(() => {
  const box = $('#tagsBox'), inp = $('#tagsIn'), MAX = 3; const tags = [];
  const help = (t, err) => { const h = $('#tagsHelp'); h.className = 'help' + (err ? ' err' : ''); h.textContent = t };
  const status = () => { inp.disabled = tags.length >= MAX; help(tags.length >= MAX ? `${MAX}個付けました。外すと足せます` : `あと ${MAX - tags.length} 個付けられます`) };
  const add = t => { const c = document.createElement('span'); c.className = 'chip'; c.dataset.t = t; c.innerHTML = `${esc(t)}<button aria-label="${esc(t)} を外す">×</button>`; inp.before(c); tags.push(t); status() };
  const remove = t => { const i = tags.indexOf(t); if (i < 0) return; tags.splice(i, 1); box.querySelector(`.chip[data-t="${CSS.escape(t)}"]`).remove(); status(); inp.focus(); sl.msg(`ラベル ${t} を外しました`) };
  inp.addEventListener('keydown', e => {
    const v = inp.value.trim().replace(/,$/, '');
    if ((e.key === 'Enter' || e.key === ',') && v) {
      e.preventDefault();
      if (tags.includes(v)) { const c = box.querySelector(`.chip[data-t="${CSS.escape(v)}"]`); c.classList.add('warn'); setTimeout(() => c.classList.remove('warn'), 1200); help(`「${v}」はもう付いています`, true); return }
      add(v); inp.value = ''; sl.msg(`ラベル ${v} を付けました`);
    } else if (e.key === 'Backspace' && !inp.value && tags.length) remove(tags[tags.length - 1]);
  });
  box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) remove(b.parentElement.dataset.t); else inp.focus() });
  add('ui'); add('tui');
})();
</script>
</body>
</html>
