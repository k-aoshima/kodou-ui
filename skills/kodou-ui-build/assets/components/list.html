<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui リスト</title>
<!-- Kodou-ui の部品の見本: リスト（list）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「リスト」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-list" data-grp="表示">
  <div class="comp-head"><h2>リスト<span class="en">list</span></h2><span class="tag t4">うまくなる</span></div>
  <p class="lead">選んだ行は反転で示します。<kbd>j</kbd><kbd>k</kbd> で動き、<kbd>Space</kbd> で複数選べます。並びは勝手に変えません。</p>
  <div class="grid2">
    <div class="box"><span class="ttl">単純</span><div class="list simple" id="lsSimple" data-key="j/k" tabindex="0" aria-label="単純なリスト"></div></div>
    <div class="box"><span class="ttl">アイコンとメタ</span><div class="list" id="lsIcon" data-key="j/k ⏎" tabindex="0" aria-label="アイコンつきのリスト"></div></div>
  </div>
  <div class="box"><span class="ttl">2行・複数選択</span><span class="ttl-r" id="lsPickN">0件 選択</span><div class="list meta" id="lsMulti" data-key="j/k Space a" tabindex="0" aria-label="複数選択のリスト"></div>
    <div class="keys"><span><kbd>j/k</kbd>移動</span><span><kbd>Space</kbd>選ぶ</span><span><kbd>a</kbd>全部</span><span><kbd>Esc</kbd>外す</span></div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">リスト</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* リスト: 見えている分だけ描く。移動したら変わった2行の印だけ付け直す */
function makeList(el, items, opts = {}) {
  let act = 0; const picked = new Set();
  el.setAttribute('role', 'listbox'); if (opts.multi) el.setAttribute('aria-multiselectable', 'true');
  const v = virt(el, {
    H: opts.H || 24, id: el.id + '-',
    make: () => { const r = document.createElement('div'); r.className = 'li'; r.setAttribute('role', 'option'); r.innerHTML = opts.simple ? '<span class="mk"></span><span class="nm"></span>' : '<span class="mk"></span><span class="ic"></span><span class="nm"></span><span class="mt"></span>'; return r },
    fill: (r, i) => {
      const it = items[i], c = r.children; r.setAttribute('aria-posinset', i + 1); r.setAttribute('aria-setsize', items.length);  /* 描いていない行があっても全体の件数を読み上げに渡す */
      if (opts.simple) { c[1].textContent = it; return }
      c[1].innerHTML = px(it.ic); c[2].innerHTML = esc(it.nm) + (it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''); c[3].textContent = it.mt || '';
    },
    mark: (r, i) => { r.classList.toggle('on', i === act); r.classList.toggle('picked', picked.has(i)); r.firstChild.textContent = opts.multi ? (picked.has(i) ? '✓' : '') : (i === act ? '>' : ''); r.setAttribute('aria-selected', opts.multi ? picked.has(i) : i === act) },
  });
  v.set(items.length); v.active(act);
  const setAct = i => { const p = act; act = Math.max(0, Math.min(items.length - 1, i)); v.mark(p); v.to(act); v.active(act) };
  const toggle = i => { picked.has(i) ? picked.delete(i) : picked.add(i); v.mark(i); opts.onPick && opts.onPick(picked.size) };
  const name = i => opts.simple ? items[i] : items[i].nm;
  el.addEventListener('click', e => { const i = v.index(e.target.closest('.li')); if (i < 0) return; setAct(i); if (opts.multi) toggle(i); el.focus(); sl.msg(`${name(i)} を選びました`) });
  el.addEventListener('keydown', e => {
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); frame(el.id, () => setAct(act + 1)) }
    else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); frame(el.id, () => setAct(act - 1)) }
    else if (e.key === ' ' && opts.multi) { e.preventDefault(); toggle(act) }
    else if (e.key === 'a' && opts.multi) { items.forEach((_, i) => picked.add(i)); v.draw(); opts.onPick(picked.size) }
    else if (e.key === 'Escape' && opts.multi) { picked.clear(); v.draw(); opts.onPick(0) }
    else if (e.key === 'Enter') sl.msg(`開いた: ${name(act)}`);
  });
}
makeList($('#lsSimple'), ['main', 'develop', 'feat/key-cast', 'fix/log-follow', 'release/1.5'], { simple: true });
makeList($('#lsIcon'), [{ ic: 'file', nm: 'session.ts', mt: '+42 -8' }, { ic: 'file', nm: 'StatusLine.tsx', mt: '+3 -3' }, { ic: 'folder', nm: 'tokens/', mt: '4 files' }, { ic: 'term', nm: 'release.sh', mt: '実行可能' }, { ic: 'pr', nm: '#128', mt: 'レビュー待ち' }]);
makeList($('#lsMulti'), [
  { ic: 'pr', nm: '#128 ステータスラインに押したキーを出す', sub: 'feat/key-cast → main  2時間前', mt: '+124 -18' },
  { ic: 'pr', nm: '#127 ログの追いかけを止められるようにする', sub: 'fix/log-follow → main  昨日', mt: '+40 -6' },
  { ic: 'pr', nm: '#125 ステータスラインの区切りを揃える', sub: 'chore/statusline → main  3日前', mt: '+12 -12' },
  { ic: 'branch', nm: 'spike/agent-steer', sub: '24日 更新なし。リモートに無いコミット 2件', mt: 'stale' },
], { multi: true, H: 48, onPick: n => { $('#lsPickN').textContent = `${n}件 選択` } });
</script>
</body>
</html>
