<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui チェック・ラジオ・スイッチ</title>
<!-- Kodou-ui の部品の見本: チェック・ラジオ・スイッチ（checkbox / radio / switch）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「チェック・ラジオ・スイッチ」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-check" data-grp="入力">
  <div class="comp-head"><h2>チェック・ラジオ・スイッチ<span class="en">checkbox / radio / switch</span></h2><span class="tag t3">ハンドルは人</span></div>
  <p class="lead">自動で何かをする設定は、既定を「切」にし、入れたときに何が起きるかを横に書きます。</p>
  <div class="grid2" id="ckAll">
    <div class="box"><span class="ttl">チェック</span><div class="box-in col" id="cbGroup">
      <label class="cb"><input type="checkbox" data-all><span class="mk"></span>すべてのテスト</label>
      <label class="cb" style="padding-left:3ch"><input type="checkbox" data-c checked><span class="mk"></span>単体テスト</label>
      <label class="cb" style="padding-left:3ch"><input type="checkbox" data-c><span class="mk"></span>結合テスト</label>
      <label class="cb" style="padding-left:3ch"><input type="checkbox" disabled><span class="mk"></span>E2E（ブラウザが無いため使えません）</label>
    </div></div>
    <div class="box"><span class="ttl">ラジオ</span><div class="box-in col" role="radiogroup" aria-label="マージの方法">
      <label class="cb rd"><input type="radio" name="m" value="squash" checked><span class="mk"></span>squash<span class="v">1つにまとめる</span></label>
      <label class="cb rd"><input type="radio" name="m" value="merge"><span class="mk"></span>merge<span class="v">コミットを残す</span></label>
      <label class="cb rd"><input type="radio" name="m" value="rebase"><span class="mk"></span>rebase<span class="v">一直線に並べる</span></label>
    </div></div>
    <div class="box"><span class="ttl">スイッチ</span><div class="box-in col">
      <label class="cb sw"><input type="checkbox" name="format" checked><span class="mk"></span>保存したら整形する<span class="v">prettier</span></label>
      <label class="cb sw"><input type="checkbox" name="ai"><span class="mk"></span>AI の変更を自動で適用する<span class="v">切なら毎回確認</span></label>
      <label class="cb sw"><input type="checkbox" disabled><span class="mk"></span>自動デプロイ（管理者だけ）</label>
    </div></div>
    <div class="box"><span class="ttl">いまの値</span><div class="box-in"><div class="out" id="ckOut"></div></div></div>
  </div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">チェック・ラジオ・スイッチ</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* チェック・ラジオ・スイッチ: 印は CSS。JS は「すべて」の中間と、いまの値の表示だけ */
function syncChecks() {
  const cs = $$('#cbGroup [data-c]'), n = cs.filter(c => c.checked).length, all = $('#cbGroup [data-all]');
  all.checked = n === cs.length; all.indeterminate = n > 0 && n < cs.length;
  const m = $('#ckAll input[name=m]:checked').value;
  $('#ckOut').innerHTML = `<code>tests=${n}/${cs.length}  merge=${m}  format=${$('#ckAll input[name=format]').checked ? 'on' : 'off'}  ai_auto=${$('#ckAll input[name=ai]').checked ? 'on' : 'off'}</code>`;
}
$('#ckAll').addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-all]')) $$('#cbGroup [data-c]').forEach(c => c.checked = t.checked);
  syncChecks();
  sl.msg(`${t.closest('label').textContent.trim()}: ${t.type === 'radio' ? t.value : t.checked ? 'on' : 'off'}`);
});
syncChecks();
</script>
</body>
</html>
