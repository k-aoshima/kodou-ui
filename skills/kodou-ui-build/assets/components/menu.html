<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui メニュー</title>
<!-- Kodou-ui の部品の見本: メニュー（menu / popover）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「メニュー」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-menu" data-grp="重ね">
  <div class="comp-head"><h2>メニュー<span class="en">menu / popover</span></h2><span class="tag t4">うまくなる</span></div>
  <p class="lead">項目の横にキーを書き、次からはメニューを開かずに使えるようにします。壊す操作は区切って最後に置きます。</p>
  <div class="box"><span class="ttl">見本</span><div class="box-in row">
    <button class="btn" id="menuBtn" data-key="Space" popovertarget="menuPop" aria-haspopup="menu" aria-expanded="false">操作 ▾</button>
    <div class="pop" id="menuPop" popover role="menu" style="min-width:26ch"></div>
    <span class="out" id="menuOut"></span>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">メニュー</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>
/* メニュー（popover） */
(() => {
  const M = [{ hd: 'ブランチ' }, { l: '名前を変える', k: 'r' }, { l: 'main を取り込む', k: 'm' }, { l: 'PR を作る', k: 'p' }, { l: 'リモートに送る', k: 'P', dis: '送る先がまだ設定されていません' }, { sep: 1 }, { l: '削除する', k: 'd', danger: 1 }];
  const btn = $('#menuBtn'), pop = $('#menuPop');
  pop.innerHTML = M.map((m, i) => m.hd ? `<div class="hd">${m.hd}</div>` : m.sep ? '<div class="sep"></div>' : `<div class="opt-ln${m.dis ? ' dis' : ''}${m.danger ? ' danger' : ''}" role="menuitem" data-i="${i}" ${m.dis ? `title="${m.dis}" aria-disabled="true"` : ''}><span class="mk"></span><span>${m.l}</span><span class="mt"><kbd class="ol">${m.k}</kbd></span></div>`).join('');
  const usable = M.map((m, i) => m.l && !m.dis ? i : -1).filter(i => i >= 0); let act = usable[0];
  const el = i => pop.querySelector(`[data-i="${i}"]`);
  const setAct = i => { el(act)?.classList.remove('on'); act = i; el(act).classList.add('on') };
  const run = i => { const m = M[i]; pop.hidePopover(); btn.focus(); $('#menuOut').textContent = m.danger ? '「削除する」は、確認の帯を出してから行います' : `「${m.l}」を選びました（次からは ${m.k} で同じことができます）`; sl.msg(`メニュー: ${m.l}`) };
  pop.addEventListener('toggle', e => { const o = e.newState === 'open'; btn.setAttribute('aria-expanded', o); if (o) { setAct(usable[0]); place(pop, btn) } });
  btn.addEventListener('keydown', e => {
    const open = pop.matches(':popover-open');
    if (!open) { if (e.key === 'ArrowDown') { e.preventDefault(); pop.showPopover() } return }
    const k = usable.indexOf(act);
    if (e.key === 'ArrowDown') { e.preventDefault(); setAct(usable[(k + 1) % usable.length]) }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setAct(usable[(k - 1 + usable.length) % usable.length]) }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(act) }
    else { const j = M.findIndex(m => m.k === e.key && !m.dis); if (j >= 0) { e.preventDefault(); run(j) } }
  });
  pop.addEventListener('click', e => { const o = e.target.closest('.opt-ln'); if (o && !o.classList.contains('dis')) run(+o.dataset.i) });
})();
</script>
</body>
</html>
