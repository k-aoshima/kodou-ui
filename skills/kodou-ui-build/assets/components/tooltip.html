<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui ツールチップ</title>
<!-- Kodou-ui の部品の見本: ツールチップ（tooltip）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「ツールチップ」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-tooltip" data-grp="重ね">
  <div class="comp-head"><h2>ツールチップ<span class="en">tooltip</span></h2></div>
  <p class="lead">アイコンには文字を添えるのが基本で、ツールチップはキーを教えるために使います。幅がどうしても足りない所だけアイコンだけにし、そのときは名前をツールチップと読み上げ用の名前（aria-label）で出します。CSS だけで動きます。</p>
  <div class="box"><span class="ttl">見本</span><div class="box-in row" style="padding-top:44px">
    <span class="tt-host"><button class="btn"><span data-px="copy"></span>コピー</button><span class="tt" role="tooltip">キーでは<kbd>⌘C</kbd></span></span>
    <span class="tt-host"><button class="btn"><span data-px="bell"></span>通知 3件</button><span class="tt" role="tooltip">キーでは<kbd>⌘⇧N</kbd></span></span>
    <span class="tt-host"><button class="btn"><span data-px="gear"></span>設定</button><span class="tt" role="tooltip">キーでは<kbd>⌘,</kbd></span></span>
    <span class="faint" style="font-size:12px">幅が足りないときだけ →</span>
    <span class="tt-host"><button class="btn icon danger" aria-label="削除"><span data-px="trash"></span></button><span class="tt" role="tooltip">削除（取り消せないため確認があります）</span></span>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">ツールチップ</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>

</script>
</body>
</html>
