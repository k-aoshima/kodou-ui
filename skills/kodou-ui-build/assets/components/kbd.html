<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui キーの表示</title>
<!-- Kodou-ui の部品の見本: キーの表示（kbd）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「キーの表示」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-kbd" data-grp="かけら">
  <div class="comp-head"><h2>キーの表示<span class="en">kbd</span></h2><span class="tag t4">うまくなる</span></div>
  <p class="lead">1つのキー、同時に押すキー、続けて押すキーを書き分けます。</p>
  <div class="box"><span class="ttl">見本</span><div class="box-in kbd-demo">
    <span><kbd>Esc</kbd></span><span class="d">1つのキー（塗り）</span>
    <span><kbd class="ol">⌘</kbd><kbd class="ol">K</kbd></span><span class="d">同時に押す（枠）</span>
    <span><kbd class="ol">g</kbd><span class="then">→</span><kbd class="ol">g</kbd></span><span class="d">続けて押す（矢印でつなぐ）</span>
    <span><kbd class="ol">⇧</kbd><kbd class="ol">↑</kbd></span><span class="d">記号のキーは記号で書く</span>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">キーの表示</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>

</script>
</body>
</html>
