<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodou-ui バッジと状態</title>
<!-- Kodou-ui の部品の見本: バッジと状態（badge / status）。tools/build-assets.py が見本帳から書き出す（手で直さない）。
     決まりは references/components.md の「バッジと状態」。作るときは、下の HTML と、最後の <script> の中の JS をそのまま写して使う。
     共通の CSS と関数は ../tokens.css ・ ../kodou.css ・ ../virt.js ・ ../ledbar.js ・ ../kodou.js ・ ../icons.js にある（この順に読む）。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kodou.css">
<style>.kd-page { max-width: 960px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)) 80px }</style>
<body>
<main class="kd-page">
<section class="comp" id="c-badge" data-grp="状態">
  <div class="comp-head"><h2>バッジと状態<span class="en">badge / status</span></h2></div>
  <p class="lead">状態は色だけに頼らず、文字か記号でも分かるようにします。</p>
  <div class="grid2">
    <div class="box"><span class="ttl">バッジ</span><div class="box-in row">
      <span class="badge solid-ok">✓ 通過</span><span class="badge solid-err">✗ 失敗</span><span class="badge solid-warn">◆ 待ち</span><span class="badge solid-n">v1.4.0</span>
      <span class="badge out-ok">merged</span><span class="badge out-err">conflict</span><span class="badge out-n">draft</span><span class="count">12</span>
    </div></div>
    <div class="box"><span class="ttl">点と文字</span><div class="box-in col">
      <span class="dotst"><i class="c-green">●</i>動いています</span>
      <span class="dotst"><i class="c-yellow">◐</i>起動中</span>
      <span class="dotst"><i class="c-red">■</i>止まっています</span>
      <span class="dotst"><i class="faint">○</i>未設定</span>
    </div></div>
  </div>
  <div class="box"><span class="ttl">起動ログ</span><div class="box-in sysd">
    <div><span class="s">[  <span class="c-green">OK</span>  ]</span> データベースにつながりました</div>
    <div><span class="s">[ <span class="c-yellow">WARN</span> ]</span> 空きメモリが 2.1G です（3G を下回りました）</div>
    <div><span class="s">[<span class="c-red">FAILED</span>]</span> ポート 8080 は node が使っています</div>
    <div><span class="s">[ <span class="spin" data-spin>⠋</span>  ]</span> 移行スクリプトを実行中 3/7</div>
  </div></div>
</section>
</main>
<div class="statusline" role="status" aria-live="off"><span class="sl-mode pl">NORMAL</span><span class="sl-msg" id="slMsg">バッジと状態</span></div>
<script src="../virt.js"></script>
<script src="../ledbar.js"></script>
<script src="../kodou.js"></script>
<script src="../icons.js"></script>
<script>

</script>
</body>
</html>
