name: pages

# 紹介ページ（site/）を根に、見本帳（catalog/）を /catalog/ に置いて GitHub Pages に出す
on:
  push:
    branches: [main]
    paths: ['site/**', 'catalog/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/catalog
          cp -R site/. _site/
          cp -R catalog/. _site/catalog/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
